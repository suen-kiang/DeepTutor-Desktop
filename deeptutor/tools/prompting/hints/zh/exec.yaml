short_description: "在隔离沙箱中执行 shell 命令，返回 stdout/stderr 与退出码。"
when_to_use: "用于数据处理、运行技能自带脚本、调用任务所需的 CLI 工具。不要用于破坏性或系统管理类命令。"
input_format: "`command` — shell 命令。可选 `timeout` — 秒（默认 30，上限 300）。命令运行在本回合的工作目录中。"
guideline: "优先使用非交互参数（如 `-y`）。根据工作区说明中标明的宿主 shell 使用对应语法，并用该 shell 自带的方式限制输出。运行技能脚本前先读其 SKILL.md。Python 工作或文件生成应把完整源码传给 code_execution，不要用 `python -c` 或 heredoc；exec 只用于真正必须使用 shell 的命令。调用 Python 包管理器时使用 `python -m pip`，不要把 `pip` 与另一个 `python` 混用。若用户要求创建或导出文件，把文件保存到工作目录，并按工具结果原样引用 Generated artifacts 下载链接。"
note: "破坏性命令（rm -rf、mkfs、shutdown 等）会被拦截。命令失败时检查 STDERR、退出码和实际 shell；不要把命令语法或依赖错误说成沙箱无权访问。只有工具明确返回拒绝访问或网络错误时，才能据此说明对应限制。"
phase: "expansion"
